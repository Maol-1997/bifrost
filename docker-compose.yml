services:
  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      PUBLIC_URL: http://localhost:3000
      DATABASE_URL: postgres://bifrost:bifrost@postgres:5432/bifrost
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY with openssl rand -base64 32}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-sol}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      JEV_MODEL: ${JEV_MODEL:-typesafe/jev-1.13}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      BIFROST_DEV_USER_ID: ${BIFROST_DEV_USER_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: bifrost
      POSTGRES_PASSWORD: bifrost
      POSTGRES_DB: bifrost
    # Published so host tooling can reach the same database the app uses:
    # `npm run migrate` and `npm run dev:server` both run outside the network.
    ports:
      - "5432:5432"
    volumes:
      - bifrost-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifrost -d bifrost"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    # Published for the same reason as postgres: `npm run dev:server` runs on the
    # host, and without a reachable Redis it silently degrades to in-process
    # locks and rate limits, which is not the behaviour we want to develop against.
    ports:
      - "6379:6379"
    volumes:
      - bifrost-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  bifrost-postgres:
  bifrost-redis:
